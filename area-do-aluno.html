<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="navbar-title">Área do Aluno</span>
    <button id="btnLogout">Sair</button>
  </nav>
  <main class="aluno-main">
    <h2>Bem-vindo à sua área exclusiva!</h2>
    <div class="aluno-links">
      <a href="aulas.html" class="aluno-link">Aulas</a>
      <a href="simulados.html" class="aluno-link">Simulados</a>
    </div>
  </main>
  <script>
    async function checkAuthAndPaid() {
        if (window.supabase && window.SUPABASE_CONFIG) {
            const supabaseClient = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
            const { data, error } = await supabaseClient.auth.getUser();
            if (error || !data || !data.user) {
                showLocked();
                return;
            }
            const { data: accessData, error: accessError } = await supabaseClient
                .from('user_access')
                .select('pago')
                .eq('user_id', data.user.id)
                .maybeSingle();
            if (!accessData || !accessData.pago) {
                showLocked();
                return;
            }
        } else {
            const userRaw = localStorage.getItem('aliadoCurrentUser');
            let user = null;
            if (userRaw) {
                try { user = JSON.parse(userRaw); } catch { user = null; }
            }
            if (!user || !user.isPaid) {
                showLocked();
                return;
            }
        }
    }
    function showLocked() {
        document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f5f5f5;">
            <div style='font-size:5rem;color:#4a7c17;'><i class="fa fa-lock"></i></div>
            <h2 style='color:#4a7c17;'>Área restrita</h2>
            <p>Faça login e confirme o pagamento para acessar esta área.</p>
            <a href='login.html' class='btn btn-success'>Fazer login</a>
        </div>`;
    }
    checkAuthAndPaid();
  </script>
</body>
</html>
